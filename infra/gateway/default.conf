server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Встроенный DNS Docker. Имена в переменных перерезолвятся каждые 10 с: после пересоздания
    # контейнера (docker compose up -d --build <service>) gateway не держит старый IP и не отдаёт 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;
    set $max_bot http://max-bot:8080;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Входящий X-Forwarded-For перезаписываем: RAG использует его для rate limit.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json application/problem+json text/css application/javascript image/svg+xml;

    location = /health {
        proxy_pass $api;
    }

    location = /docs {
        proxy_pass $api;
    }

    location = /openapi.json {
        proxy_pass $api;
    }

    location = /webhooks/max {
        client_max_body_size 64k;
        proxy_pass $max_bot;
    }

    location = /api/v1 {
        return 404;
    }

    # С переменной и без URI в proxy_pass nginx передаёт исходный URI запроса без изменений.
    location /api/v1/ {
        proxy_read_timeout 120s;
        proxy_pass $api;
    }

    location /api/ {
        proxy_pass $api;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # SPA и публичный вход теперь обслуживает один nginx.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    }
}

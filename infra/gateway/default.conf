server {
    listen 8080;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Входящий X-Forwarded-For перезаписываем: RAG использует его для rate limit.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /health {
        proxy_pass http://glossary-rag:8000/health;
    }

    location = /docs {
        proxy_pass http://glossary-rag:8000/docs;
    }

    location = /openapi.json {
        proxy_pass http://glossary-rag:8000/openapi.json;
    }

    location = /api/v1 {
        return 404;
    }

    location /api/v1/ {
        proxy_read_timeout 120s;
        proxy_pass http://glossary-rag:8000;
    }

    location /api/ {
        proxy_pass http://planets-api:8080;
    }

    # Существующий PoC одногруппника сохранён без изменений; будущий общий UI заменит этот маршрут.
    location / {
        proxy_pass http://planets-api:8080;
    }
}

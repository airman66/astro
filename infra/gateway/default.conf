server {
    listen 8080;
    server_name _;

    # Встроенный DNS Docker. Имена в переменных перерезолвятся каждые 10 с: после пересоздания
    # контейнера (docker compose up -d --build <service>) gateway не держит старый IP и не отдаёт 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $rag http://glossary-rag:8000;
    set $planets http://planets-api:8080;
    set $portal http://portal:8080;
    set $max_bot http://max-bot:8080;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Входящий X-Forwarded-For перезаписываем: RAG использует его для rate limit.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json application/problem+json text/css application/javascript image/svg+xml;

    location = /health {
        proxy_pass $rag;
    }

    location = /docs {
        proxy_pass $rag;
    }

    location = /openapi.json {
        proxy_pass $rag;
    }

    location = /webhooks/max {
        client_max_body_size 64k;
        proxy_pass $max_bot;
    }

    location = /api/v1 {
        return 404;
    }

    # С переменной и без URI в proxy_pass nginx передаёт исходный URI запроса без изменений.
    location /api/v1/ {
        proxy_read_timeout 120s;
        proxy_pass $rag;
    }

    location /api/ {
        proxy_pass $planets;
    }

    # Единый фронтенд портала. Прежний PoC остаётся в services/planets-api/Planets.Api/wwwroot.
    location / {
        proxy_pass $portal;
    }
}

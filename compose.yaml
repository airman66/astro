name: tulahack2026

services:
  gateway:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - ./infra/gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - planets-api
      - glossary-rag
      - portal
    restart: unless-stopped

  # Единый фронтенд портала (статическая сборка, nginx); доступен через gateway по /.
  portal:
    build: ./services/portal
    restart: unless-stopped

  planets-api:
    build: ./services/planets-api
    volumes:
      - catalog-data:/app/data
    restart: unless-stopped

  glossary-rag:
    build: ./services/glossary-rag
    environment:
      ASSISTANT_PROVIDER: ${ASSISTANT_PROVIDER:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      RUNPOD_API_KEY: ${RUNPOD_API_KEY:-}
      RUNPOD_ENDPOINT_ID: ${RUNPOD_ENDPOINT_ID:-b1dd8hy2hqo1nb}
      RUNPOD_MODEL: ${RUNPOD_MODEL:-glm-5.3}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      REDIS_URL: redis://redis:6379/0
      TRUSTED_PROXIES: 172.16.0.0/12
      SESSION_SECRET: ${SESSION_SECRET:-}
      EMBEDDING_URL: ${EMBEDDING_URL:-http://embeddings:8080/v1/embeddings}
    depends_on:
      redis:
        condition: service_healthy
      # Справочник и поиск работают и без эмбеддингов (только FTS), поэтому зависимость не обязательна.
      embeddings:
        condition: service_started
        required: false
    volumes:
      - ./services/glossary-rag/data:/app/data
    restart: unless-stopped

  telegram-bot:
    profiles: ["telegram"]
    build: ./services/bots
    environment:
      BOT_PLATFORM: telegram
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      RAG_URL: http://glossary-rag:8000
      PORTAL_PUBLIC_URL: ${PORTAL_PUBLIC_URL:-http://localhost:8090}
    depends_on: [glossary-rag]
    restart: unless-stopped

  max-bot:
    profiles: ["max"]
    build: ./services/bots
    environment:
      BOT_PLATFORM: max
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_WEBHOOK_URL: ${MAX_WEBHOOK_URL:-}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-}
      RAG_URL: http://glossary-rag:8000
      PORTAL_PUBLIC_URL: ${PORTAL_PUBLIC_URL:-http://localhost:8090}
    depends_on: [glossary-rag]
    volumes:
      - max-bot-queue:/app/queue
    restart: unless-stopped

  model-fetch:
    image: ghcr.io/ggml-org/llama.cpp:server
    entrypoint: ["/bin/sh", "/scripts/fetch_embedding_model.sh"]
    volumes:
      - ./services/glossary-rag/data/models:/models
      - ./services/glossary-rag/scripts/fetch_embedding_model.sh:/scripts/fetch_embedding_model.sh:ro
    restart: "no"

  embeddings:
    image: ghcr.io/ggml-org/llama.cpp:server
    depends_on:
      model-fetch:
        condition: service_completed_successfully
    command:
      - -m
      - /models/Qwen3-Embedding-8B-Q4_K_M.gguf
      - --embedding
      - --pooling
      - last
      - -c
      - "4096"
      - -b
      - "4096"
      - -ub
      - "2048"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    volumes:
      - ./services/glossary-rag/data/models:/models:ro
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  catalog-data:
  max-bot-queue:
